facts:
  - id: official_channels
    label: Where to get information and subscribe
    text: >-
      The SEC Nigeria circular of 14 September 2026 says applications and payments must
      go only through officially designated and approved receiving agents and subscription
      channels, and that investors should get information about the IPO only from SEC
      official channels, the issuer's official channels, and other official channels set up
      for the IPO. The official IPO website is ipo.dangote.com. The site itself repeats this:
      "Stay safe. Subscribe only through approved channels. Only use subscription channels
      listed on this official website. We will never ask for your PIN, password or OTP."
    status: confirmed
    verified_at: "2026-09-19"
    sources:
      - name: Dangote Petroleum Refinery IPO, official subscribe page
        url: https://ipo.dangote.com/subscribe
      - name: SEC Nigeria circular on the Dangote IPO
        url: https://sec.gov.ng/for-investors/keep-track-of-circulars/dangote-petroleum-refinery-and-petrochemicals-initial-public-offering/
  - id: requirements
    label: What you generally need to subscribe
    text: >-
      Investors generally need a BVN and correct bank account details, plus a CSCS
      account (or stockbroking details) to hold the shares. It has been reported that
      first-time investors do not necessarily need an existing CSCS number beforehand,
      because one can be created during subscription after BVN and bank verification.
      The exact process depends on the platform.
    status: reported
    verified_at: null
    sources:
      - name: Technext24, platforms to buy Dangote refinery shares
        url: https://technext24.com/explainer/18-platforms-to-buy-dangote-refinery-shares/
      - name: Nairametrics, what you should know and how to buy
        url: https://nairametrics.com/2026/09/11/dangote-refinery-ipo-what-you-should-know-and-how-to-buy/
