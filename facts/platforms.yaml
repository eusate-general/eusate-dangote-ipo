# Platform directory. listing_status:
#   official   = a human confirmed it on https://ipo.dangote.com/ (set verified_at)
#   reported   = named as an approved channel by independent press, not yet confirmed
#   unverified = only the platform itself says so; the bot discusses it only if asked
#   not_listed = confirmed absent; never recommended
#
# Rebuilt 2026-09-19 from a full render of https://ipo.dangote.com/subscribe (the site's "Choose
# how you want to subscribe" table — its own words: "SEC approved Receiving Agents and Electronic
# Application Channels"), verified with a headless-browser check. This is the same technique the
# scheduled primary-source watcher (scripts/watch-primary.ts) uses, so this file is what that
# watcher's first real run produced, by hand. All 55 official channels are current as of the date
# below. Offer price, minimum and dates matched facts/ipo.yaml exactly, so those moved to
# `confirmed` there too. Six previously "reported"/"unverified" platforms are NOT on this official
# list (Daba included) and are now `not_listed`.

