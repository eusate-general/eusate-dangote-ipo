name: eval suite

# Costs real money per run (~$0.50-1 as of 2026-09-19), so it runs only when something that could
# change answer quality actually changed, plus on demand. See PLAN.md section 9 for the gate.
on:
  push:
    branches: [main]
    paths:
      - "src/lib/prompt.ts"
      - "src/lib/engine/**"
      - "src/lib/news/**"
      - "src/lib/redact.ts"
      - "facts/**"
      - "evals/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dangote_ipo_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dangote_ipo_eval
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Generates src/generated/knowledge.json and faq.json, which evals/run.ts imports
      # transitively. ANTHROPIC_API_KEY is blanked only for this step so build-faq.ts takes its
      # own "no key" fallback and writes an empty FAQ cache: runTurn() checks that cache first
      # and returns a free cached answer on a hit, so a *populated* cache here could silently
      # serve a golden case from cache instead of the live model, corrupting this suite's
      # pass/fail and cost numbers. The real key is restored (via the job-level env above) for
      # the eval step itself.
      - run: npm run generate
        env:
          ANTHROPIC_API_KEY: ""
      - run: npm run eval
